<div [class]='["layout", conversation ? "with-conversation" : ""]'>
	<div class='conversations'>
		<div (click)='showAddConversation = true' style='width: 100%; height: 50px; background-color: #111; border: solid 1px #222; border-radius: 6px; margin-bottom: 10px; display: flex; gap: 10px; padding: 0 15px; font-size: 16px; align-items: center;'>
			<app-icon set='mention' size='18px' />
			<span>Buscar conversación</span>
		</div>
		<app-conversation-list (addConversation)='showAddConversation = true' [selectedId]='conversation' />
	</div>
	<div class='conversation'>
		@if (!conversation) {
			<div class='start'>
				<h1>Empieza a chatear ahora!</h1>
				<app-button
					width='fit-content'
					[rounded]='true'
					variant='primary'
					(click)='showAddConversation = true'
				>Iniciar conversación</app-button>
			</div>
		} @else {
			<app-conversation [id]='conversation' />
		}
	</div>
</div>
<app-add-conversation-dialog [(show)]='showAddConversation' />
