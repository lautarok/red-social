<div class='layout'>
	<div class='conversations'>
		<app-conversation-list />
	</div>
	@if (!conversation) {
		<div class='start'>
			<h1>Empieza a chatear ahora!</h1>
			<app-button
				width='fit-content'
				[rounded]='true'
				variant='primary'
				(click)='showAddConversation = true'
			>Iniciar conversación</app-button>
		</div>
	} @else {
		<app-conversation [id]='conversation' />
	}
</div>
<app-add-conversation-dialog [(show)]='showAddConversation' />
